# 可选：nginx 反代（panel.json 里 bind=127.0.0.1, port=8080, tls=false）。
# 国内云服务器：未备案域名走 80/443 会被拦截，建议用 8443 这类非标端口。
# 面板用 X-Real-IP 识别客户端 IP（登录失败限速），两个 location 都要传。
server {
    listen 8443 ssl;
    server_name l4d2.example.com;
    ssl_certificate     /etc/ssl/l4d2panel.pem;
    ssl_certificate_key /etc/ssl/private/l4d2panel.key;
    client_max_body_size 32m;                # 插件 .smx 上传（≤ 20 MB）走普通 location
    location = /api/upload {                 # 战役 vpk 上传：大文件、不缓冲
        client_max_body_size 3072m;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
