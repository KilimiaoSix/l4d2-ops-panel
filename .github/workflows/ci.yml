name: Validate panel
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.20', '3.12.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed dependencies
        working-directory: panel
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and real HTTP parity
        working-directory: panel
        run: python -m pytest -q --basetemp=/var/tmp/l4d2-ci-tests
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install fixed runtime dependencies
        working-directory: panel
        run: python -m pip install -r requirements.txt
      - name: Build actual frontend, plugins and final archive
        run: python tools/release/build.py --version "0.0.0-ci.${GITHUB_RUN_ID}"
      - name: Check real archive with an ephemeral test signature
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key_dir/private.pem" 2>/dev/null
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem"
          version="0.0.0-ci.${GITHUB_RUN_ID}"
          python tools/release/render_bootstrap.py --version "$version" --public-key "$key_dir/public.pem" --output dist/get.sh
          python tools/release/sign.py --directory dist --version "$version" --public-key "$key_dir/public.pem" --private-key "$key_dir/private.pem"
          python tools/release/verify.py --directory dist --version "$version" --public-key "$key_dir/public.pem" --extract "$RUNNER_TEMP/verified-test-release"
      - name: Install minimal and full profiles from actual final tar
        working-directory: panel
        run: python -m tests.pack_release_smoke ../dist/l4d2-panel-linux-x86_64.tar.gz
