name: Build signed candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (candidate remains unpublished)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fixed runtime and test dependencies
        working-directory: panel
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify code before building
        working-directory: panel
        run: python -m pytest -q --basetemp=/var/tmp/l4d2-release-tests
      - name: Build actual SPA, plugins and final archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python tools/release/build.py --version "$RELEASE_VERSION"
      - name: Test actual final-tar payloads
        working-directory: panel
        run: python -m tests.pack_release_smoke ../dist/l4d2-panel-linux-x86_64.tar.gz
      - name: Render and sign installer assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_file"
          mirror=$(python -c 'import json; p=json.load(open("tools/release/toolchain.json")); print(p["mirror"] or "")')
          python tools/release/render_bootstrap.py --version "$RELEASE_VERSION" --public-key tools/release/release-public.pem --mirror "$mirror" --output dist/get.sh
          python tools/release/sign.py --directory dist --version "$RELEASE_VERSION" --public-key tools/release/release-public.pem --private-key "$key_file"
          python tools/release/verify.py --directory dist --version "$RELEASE_VERSION" --public-key tools/release/release-public.pem --extract "$RUNNER_TEMP/verified-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-candidate-${{ inputs.version }}
          path: |
            dist/l4d2-panel-linux-x86_64.tar.gz
            dist/get.sh
            dist/VERSION
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 14
